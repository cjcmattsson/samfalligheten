<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Östergårdshus samfällighetsförening" />
    <title>Östergårdshus samfällighetsförening</title>
    <script>
      try {
        var root = document.documentElement;
        var saved = localStorage.getItem("theme");
        var dark = matchMedia("(prefers-color-scheme: dark)").matches;
        if (!root.dataset.theme) root.dataset.theme = saved || (dark ? "dark" : "light");
      } catch (e) {
        document.documentElement.dataset.theme ||= "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
